<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Repo Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface-hover: #1f242c;
  --border: #30363d;
  --text-primary: #e6edf3;
  --text-secondary: #7d8590;
  --accent: #2f81f7;
  --accent-hover: #388bfd;
  --accent-weak: rgba(47,129,247,0.15);
  --success: #3fb950;
  --danger: #f85149;
  --warning: #d29922;
  --radius: 10px;
  --font-ui: "Inter", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* Header */
.topbar {
  height: 68px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 20px;
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 18px;
  color: var(--text-primary);
  white-space: nowrap;
  letter-spacing: -0.3px;
}

.brand svg {
  width: 28px;
  height: 28px;
  fill: var(--text-primary);
}

.search-box {
  flex: 1;
  max-width: 560px;
  display: flex;
  gap: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(47,129,247,0.15);
}

.search-box input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-primary);
  padding: 6px 10px;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}

.search-box input::placeholder {
  color: var(--text-secondary);
}

.search-box button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 18px;
  border-radius: 7px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  font-family: inherit;
  font-size: 13px;
}

.search-box button:hover {
  background: var(--accent-hover);
}

.search-box button:active {
  transform: translateY(1px);
}

.repo-meta {
  margin-left: auto;
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
  font-family: var(--font-mono);
  white-space: nowrap;
}

/* Workspace */
.workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 340px;
  min-width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.breadcrumb-wrap {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(13,17,23,0.4);
}

.breadcrumb {
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.breadcrumb a {
  color: var(--accent);
  text-decoration: none;
  cursor: pointer;
  font-weight: 500;
  transition: opacity 0.15s;
}

.breadcrumb a:hover {
  opacity: 0.8;
  text-decoration: underline;
}

.breadcrumb .sep {
  opacity: 0.4;
  font-size: 12px;
}

.file-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.file-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s;
  color: var(--text-primary);
  text-decoration: none;
  margin-bottom: 2px;
  border: 1px solid transparent;
}

.file-item:hover {
  background: var(--surface-hover);
  border-color: var(--border);
}

.file-item.active {
  background: var(--accent-weak);
  border-color: rgba(47,129,247,0.35);
}

.file-item .icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.file-item .icon svg {
  width: 18px;
  height: 18px;
}

.file-item .name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 13.5px;
}

.file-item .size {
  font-size: 11.5px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  flex-shrink: 0;
}

.rate-limit {
  padding: 10px 18px;
  font-size: 11px;
  color: var(--text-secondary);
  border-top: 1px solid var(--border);
  background: rgba(13,17,23,0.4);
  display: flex;
  align-items: center;
  gap: 8px;
}

.rate-limit .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
}

/* Preview */
.preview {
  flex: 1;
  overflow-y: auto;
  background: var(--bg);
  padding: 24px 28px;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-secondary);
  text-align: center;
  gap: 18px;
  animation: fadeIn 0.4s ease;
}

.empty-state svg {
  width: 72px;
  height: 72px;
  opacity: 0.25;
  margin-bottom: 8px;
}

.empty-state h2 {
  margin: 0;
  font-weight: 600;
  font-size: 18px;
  color: var(--text-primary);
}

.empty-state p {
  margin: 0;
  max-width: 320px;
  line-height: 1.6;
}

.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  animation: fadeIn 0.25s ease;
}

.preview-title {
  font-size: 18px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.2px;
}

.preview-title .icon svg {
  width: 22px;
  height: 22px;
}

.preview-meta {
  font-size: 12.5px;
  color: var(--text-secondary);
  margin-top: 4px;
  font-family: var(--font-mono);
}

.preview-actions {
  display: flex;
  gap: 8px;
}

.preview-actions button,
.tab-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 7px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s, border-color 0.15s;
}

.preview-actions button:hover,
.tab-btn:hover {
  background: var(--surface-hover);
  border-color: var(--text-secondary);
}

.tab-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.preview-content {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  animation: fadeIn 0.3s ease;
}

.preview-content.image,
.preview-content.audio,
.preview-content.video {
  background: transparent;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.preview-content.image img {
  max-width: 100%;
  max-height: 72vh;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
}

.preview-content.audio audio {
  width: 100%;
  max-width: 560px;
}

.preview-content.video video {
  width: 100%;
  max-width: 720px;
  max-height: 72vh;
  border-radius: var(--radius);
}

.preview-content.pdf iframe,
.preview-content.html iframe {
  width: 100%;
  height: 72vh;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
}

.preview-content.code pre,
.preview-content.text pre {
  margin: 0;
  padding: 18px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.65;
  max-height: 74vh;
  overflow-y: auto;
}

.preview-content.text pre {
  color: var(--text-primary);
  white-space: pre-wrap;
  word-break: break-word;
}

.preview-content.markdown {
  padding: 28px 32px;
  line-height: 1.7;
  max-width: 900px;
  margin: 0 auto;
}

.preview-content.markdown h1,
.preview-content.markdown h2,
.preview-content.markdown h3 {
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.4em;
  margin-top: 1.4em;
}

.preview-content.markdown img {
  max-width: 100%;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.preview-content.markdown code {
  background: var(--bg);
  padding: 3px 6px;
  border-radius: 5px;
  font-family: var(--font-mono);
  font-size: 0.9em;
}

.preview-content.markdown pre code {
  display: block;
  padding: 14px;
  overflow-x: auto;
}

.preview-content.binary {
  padding: 48px;
  text-align: center;
  color: var(--text-secondary);
}

.preview-content.binary .big-icon {
  font-size: 56px;
  margin-bottom: 16px;
  opacity: 0.35;
}

.preview-content.binary a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}

.preview-content.binary a:hover {
  text-decoration: underline;
}

.tabs {
  display: flex;
  gap: 8px;
  padding: 14px 18px 0;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.tab-body {
  padding: 0;
}

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: #484f58; background-clip: content-box; }

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Responsive */
@media (max-width: 860px) {
  .workspace { flex-direction: column; }
  .sidebar { width: 100%; height: 40%; min-height: 220px; border-right: none; border-bottom: 1px solid var(--border); }
  .preview { padding: 18px; }
  .topbar { flex-wrap: wrap; height: auto; padding: 14px; gap: 12px; }
  .search-box { max-width: 100%; width: 100%; order: 3; }
  .repo-meta { margin-left: 0; order: 2; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.215 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.28-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      <span>RepoViewer</span>
    </div>
    <div class="search-box">
      <input type="text" id="repo-url" placeholder="https://github.com/user/repo" value="https://github.com/Timeness/Genis">
      <button id="load-btn">Load Repo</button>
    </div>
    <div class="repo-meta" id="repo-meta"></div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <div class="breadcrumb-wrap">
        <div class="breadcrumb" id="breadcrumb">
          <span style="opacity:.5;">Enter a repo URL to browse</span>
        </div>
      </div>
      <div class="file-list" id="file-list">
        <div class="empty-state" style="opacity:.7;">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 14H4V8h16v12z"/></svg>
          <p>No repo loaded yet</p>
        </div>
      </div>
      <div class="rate-limit" id="rate-limit">
        <div class="dot"></div>
    <span>Ready to fetch</span>
      </div>
    </aside>

    <main class="preview" id="preview">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zM6 20V4h5v7h7v9H6z"/></svg>
        <h2>Preview Files Instantly</h2>
        <p>Paste any public GitHub repo link, browse the file tree, and click any file to preview images, HTML, audio, code, markdown, and more.</p>
      </div>
    </main>
  </div>
</div>

<script>
/* ---------- Icons ---------- */
const ICONS = {
  folder: `<svg viewBox="0 0 24 24" fill="#58a6ff"><path d="M2 6a2 2 0 0 1 2-2h5l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6z"/></svg>`,
  file:   `<svg viewBox="0 0 24 24" fill="#7d8590"><path d="M4 4a2 2 0 0 1 2-2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z"/></svg>`,
  image:  `<svg viewBox="0 0 24 24" fill="#3fb950"><path d="M4 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H4zm0 16v-6l4-4 4 4 6-6 2 2v10H4z"/></svg>`,
  audio:  `<svg viewBox="0 0 24 24" fill="#a371f7"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`,
  video:  `<svg viewBox="0 0 24 24" fill="#f778ba"><path d="M8 6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V6zM2 8a2 2 0 0 1 2-2v12a2 2 0 0 1-2-2V8zm17.5 4l-5 3v-6l5 3z"/></svg>`,
  code:   `<svg viewBox="0 0 24 24" fill="#58a6ff"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>`,
  text:   `<svg viewBox="0 0 24 24" fill="#7d8590"><path d="M4 4a2 2 0 0 1 2-2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4zm2 0v12h12V8h-6V4H6z"/></svg>`,
  binary: `<svg viewBox="0 0 24 24" fill="#d29922"><path d="M4 4a2 2 0 0 1 2-2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z"/></svg>`,
  pdf:    `<svg viewBox="0 0 24 24" fill="#f85149"><path d="M4 4a2 2 0 0 1 2-2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z"/></svg>`,
};

/* ---------- State ---------- */
const state = {
  owner: null,
  repo: null,
  currentPath: '',
  cache: new Map(),
  activeFile: null,
};

const els = {
  repoUrl: document.getElementById('repo-url'),
  loadBtn: document.getElementById('load-btn'),
  fileList: document.getElementById('file-list'),
  breadcrumb: document.getElementById('breadcrumb'),
  preview: document.getElementById('preview'),
  repoMeta: document.getElementById('repo-meta'),
  rateLimit: document.getElementById('rate-limit'),
};

/* ---------- Helpers ---------- */
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k,i)).toFixed(2)) + ' ' + sizes[i];
}

function parseGitHubUrl(url) {
  try {
    const u = new URL(url.trim());
    if (!u.hostname.endsWith('github.com')) return null;
    const parts = u.pathname.split('/').filter(Boolean);
    if (parts.length < 2) return null;
    return { owner: parts[0], repo: parts[1].replace(/\.git$/, '').replace(/\/$/, '') };
  } catch { return null; }
}

function getFileCategory(name) {
  const lower = name.toLowerCase();
  const ext = lower.includes('.') ? lower.split('.').pop() : '';

  const noExtNames = ['dockerfile','makefile','license','readme','changelog','authors','copying','gemfile','rakefile','gemfile.lock'];
  const hasNoRealExt = !ext || noExtNames.some(n => lower === n || lower.startsWith(n+'.'));

  if (hasNoRealExt) {
    if (lower === 'license' || lower === 'readme' || lower === 'changelog' || lower === 'copying' || lower === 'authors')
      return { type: 'text', icon: 'text', lang: 'text' };
    return { type: 'code', icon: 'code', lang: 'text' };
  }

  const imageExts = ['png','jpg','jpeg','gif','bmp','svg','webp','ico','avif'];
  const audioExts = ['mp3','wav','ogg','m4a','flac','aac','wma'];
  const videoExts = ['mp4','webm','mov','mkv','avi','flv'];
  const webExts   = ['html','htm'];
  const mdExts    = ['md','markdown'];
  const codeExts  = ['js','jsx','ts','tsx','py','java','cpp','c','h','hpp','cs','go','rs','rb','php','css','scss','sass','sql','sh','bash','ps1','json','xml','yaml','yml','ini','conf','cfg','toml','vue','svelte','swift','kt','dart','lua','r','pl','groovy'];
  const textExts  = ['txt','log','csv','env','gitignore','dockerignore','editorconfig','npmrc','babelrc','prettierrc','eslintrc'];

  if (imageExts.includes(ext)) return { type: 'image', icon: 'image', lang: null };
  if (audioExts.includes(ext)) return { type: 'audio', icon: 'audio', lang: null };
  if (videoExts.includes(ext)) return { type: 'video', icon: 'video', lang: null };
  if (webExts.includes(ext))   return { type: 'html',  icon: 'code',  lang: 'markup' };
  if (mdExts.includes(ext))    return { type: 'markdown', icon: 'text', lang: 'markdown' };
  if (codeExts.includes(ext))  return { type: 'code',  icon: 'code',  lang: ext };
  if (textExts.includes(ext))  return { type: 'text',  icon: 'text',  lang: 'text' };
  if (ext === 'pdf')           return { type: 'pdf',   icon: 'pdf',   lang: null };

  return { type: 'binary', icon: 'binary', lang: null };
}

function mapPrismLang(ext) {
  const map = {
    js: 'javascript', jsx: 'javascript', ts: 'typescript', tsx: 'typescript',
    py: 'python', java: 'java', cpp: 'cpp', c: 'c', h: 'c', hpp: 'cpp',
    cs: 'csharp', go: 'go', rs: 'rust', rb: 'ruby', php: 'php',
    css: 'css', scss: 'scss', sass: 'sass', sql: 'sql',
    sh: 'bash', bash: 'bash', ps1: 'powershell', json: 'json',
    xml: 'xml', yaml: 'yaml', yml: 'yaml', ini: 'ini',
    conf: 'ini', cfg: 'ini', toml: 'toml', vue: 'markup',
    svelte: 'markup', swift: 'swift', kt: 'kotlin', dart: 'dart',
    lua: 'lua', r: 'r', pl: 'perl', groovy: 'groovy',
    html: 'markup', htm: 'markup', md: 'markdown', markdown: 'markdown',
    text: 'text', txt: 'text', log: 'text', csv: 'text',
  };
  return map[ext] || ext || 'text';
}

/* ---------- API ---------- */
async function fetchDirectory(path) {
  const key = `${state.owner}/${state.repo}/${path || 'root'}`;
  if (state.cache.has(key)) return state.cache.get(key);

  const api = `https://api.github.com/repos/${state.owner}/${state.repo}/contents/${path}`;
  const res = await fetch(api);

  const remaining = res.headers.get('x-ratelimit-remaining');
  const limit = res.headers.get('x-ratelimit-limit');
  if (remaining) {
    const low = parseInt(remaining) < 10;
    els.rateLimit.innerHTML = `<div class="dot" style="background:${low?'var(--danger)':'var(--success)'}"></div><span>API: ${remaining}/${limit} left</span>`;
  }

  if (res.status === 403) {
    const body = await res.json().catch(()=>({}));
    if (body.message && body.message.includes('rate limit')) {
      const reset = res.headers.get('x-ratelimit-reset');
      const time = reset ? new Date(parseInt(reset)*1000).toLocaleTimeString() : 'soon';
      throw new Error(`GitHub API rate limit exceeded. Resets at ${time}. Try again later or use a different network.`);
    }
  }
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);

  const data = await res.json();
  if (!Array.isArray(data)) throw new Error('Unexpected response format');

  state.cache.set(key, data);
  return data;
}

/* ---------- UI: Sidebar ---------- */
function renderBreadcrumb() {
  const parts = state.currentPath.split('/').filter(Boolean);
  let html = `<a onclick="navigateTo('')">${escapeHtml(state.repo)}</a>`;
  let acc = '';
  for (const p of parts) {
    acc += (acc ? '/' : '') + p;
    html += ` <span class="sep">/</span> <a onclick="navigateTo('${escapeHtml(acc)}')">${escapeHtml(p)}</a>`;
  }
  els.breadcrumb.innerHTML = html;
}

function renderFileList(items) {
  const sorted = [...items].sort((a,b)=>{
    if (a.type === b.type) return a.name.localeCompare(b.name);
    return a.type==='dir' ? -1 : 1;
  });

  els.fileList.innerHTML = '';
  for (const item of sorted) {
    const info = item.type==='dir' ? {icon:'folder'} : getFileCategory(item.name);
    const icon = ICONS[info.icon] || ICONS.file;
    const size = item.type==='file' ? formatBytes(item.size) : '';

    const row = document.createElement('div');
    row.className = 'file-item' + (item.type==='dir'?' dir':'') + (state.activeFile===item.path?' active':'');
    row.onclick = () => item.type==='dir' ? navigateTo(item.path) : openFile(item);
    row.innerHTML = `
      <div class="icon">${icon}</div>
      <div class="name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
      <div class="size">${size}</div>
    `;
    els.fileList.appendChild(row);
  }
}

/* ---------- UI: Preview ---------- */
async function openFile(item) {
  state.activeFile = item.path;
  // re-highlight active row
  const currentItems = state.cache.get(`${state.owner}/${state.repo}/${state.currentPath || 'root'}`);
  if (currentItems) renderFileList(currentItems);

  const info = getFileCategory(item.name);
  const downloadUrl = item.download_url;
  const htmlUrl = item.html_url;

  // Build header
  els.preview.innerHTML = `
    <div class="preview-header">
      <div>
        <div class="preview-title">
          <div class="icon">${ICONS[info.icon] || ICONS.file}</div>
          ${escapeHtml(item.name)}
        </div>
        <div class="preview-meta">${formatBytes(item.size)} &bull; ${info.type.toUpperCase()}</div>
      </div>
      <div class="preview-actions">
        <button onclick="window.open('${htmlUrl}','_blank')">Open on GitHub</button>
        <button onclick="window.open('${downloadUrl}','_blank')">Download</button>
      </div>
    </div>
    <div class="preview-content ${info.type}" id="pc">
      <div style="padding:40px;text-align:center;color:var(--text-secondary);">Loading preview…</div>
    </div>
  `;

  const pc = document.getElementById('pc');

  try {
    // Large file guard
    if (item.size > 2 * 1024 * 1024) {
      pc.innerHTML = `
        <div class="binary">
          <div class="big-icon">📦</div>
          <p>File is too large to preview safely.</p>
          <p style="font-size:12px;margin-top:6px;">${formatBytes(item.size)}</p>
          <a href="${downloadUrl}" target="_blank" style="margin-top:14px;display:inline-block;">Download File</a>
        </div>`;
      return;
    }

    if (info.type === 'image') {
      pc.innerHTML = `<img src="${downloadUrl}" alt="${escapeHtml(item.name)}" onload="this.style.opacity=1" style="opacity:0;transition:opacity .4s ease;">`;
    }
    else if (info.type === 'audio') {
      pc.innerHTML = `<audio controls src="${downloadUrl}" preload="metadata"></audio>`;
    }
    else if (info.type === 'video') {
      pc.innerHTML = `<video controls src="${downloadUrl}" preload="metadata" style="max-width:100%;max-height:72vh;border-radius:var(--radius);"></video>`;
    }
    else if (info.type === 'pdf') {
      pc.innerHTML = `<iframe src="${downloadUrl}" sandbox="allow-same-origin"></iframe>`;
    }
    else if (['text','code','html','markdown'].includes(info.type)) {
      const res = await fetch(downloadUrl);
      if (!res.ok) throw new Error('Failed to fetch raw file');
      const text = await res.text();

      if (info.type === 'markdown') {
        const raw = marked.parse(text);
        const clean = DOMPurify.sanitize(raw);
        pc.innerHTML = `<div class="markdown">${clean}</div>`;
      }
      else if (info.type === 'html') {
        const safeText = escapeHtml(text);
        pc.innerHTML = `
          <div class="tabs">
            <button class="tab-btn active" onclick="switchHtmlTab(event,'source')">Source</button>
            <button class="tab-btn" onclick="switchHtmlTab(event,'preview')">Preview</button>
          </div>
          <div class="tab-body" id="html-source"><pre><code class="language-markup">${safeText}</code></pre></div>
          <div class="tab-body" id="html-preview" style="display:none;padding:0;">
            <iframe sandbox="allow-scripts" style="width:100%;height:72vh;border:none;background:#fff;" id="html-preview-frame"></iframe>
          </div>
        `;
        // defer blob creation until tab switch to avoid unnecessary work
        window.__htmlPreviewText = text;
        Prism.highlightAll();
      }
      else {
        const langClass = info.lang ? `language-${mapPrismLang(info.lang)}` : 'language-text';
        pc.innerHTML = `<pre><code class="${langClass}">${escapeHtml(text)}</code></pre>`;
        Prism.highlightAll();
      }
    }
    else {
      pc.innerHTML = `
        <div class="binary">
          <div class="big-icon">📦</div>
          <p>Binary file</p>
          <p style="font-size:12px;margin-top:6px;">${escapeHtml(item.name)}</p>
          <a href="${downloadUrl}" target="_blank" style="margin-top:14px;display:inline-block;">Download File</a>
        </div>`;
    }
  } catch (err) {
    pc.innerHTML = `<div class="binary" style="color:var(--danger);"><div class="big-icon">⚠️</div><p>Error loading preview</p><p style="font-size:12px;margin-top:6px;">${escapeHtml(err.message)}</p></div>`;
  }
}

/* ---------- HTML Preview Tabs ---------- */
window.switchHtmlTab = function(ev, name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  ev.target.classList.add('active');
  document.getElementById('html-source').style.display = name==='source' ? 'block' : 'none';
  document.getElementById('html-preview').style.display = name==='preview' ? 'block' : 'none';
  if (name==='preview') {
    const frame = document.getElementById('html-preview-frame');
    if (window.__htmlPreviewText && !frame.src) {
      const blob = new Blob([window.__htmlPreviewText], {type: 'text/html'});
      frame.src = URL.createObjectURL(blob);
    }
  }
};

/* ---------- Navigation ---------- */
window.navigateTo = async function(path) {
  state.currentPath = path;
  state.activeFile = null;
  renderBreadcrumb();
  els.fileList.innerHTML = '<div style="padding:24px;color:var(--text-secondary);text-align:center;">Loading…</div>';
  try {
    const items = await fetchDirectory(path);
    renderFileList(items);
    // If folder, maybe show a message in preview
    els.preview.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 14H4V8h16v12z"/></svg>
        <h2>Folder</h2>
        <p>Select a file from the sidebar to preview its contents.</p>
      </div>`;
  } catch (e) {
    els.fileList.innerHTML = `<div style="padding:24px;color:var(--danger);text-align:center;">${escapeHtml(e.message)}</div>`;
  }
};

/* ---------- Init ---------- */
els.loadBtn.addEventListener('click', () => {
  const parsed = parseGitHubUrl(els.repoUrl.value);
  if (!parsed) {
    alert('Invalid GitHub URL.\nExample: https://github.com/Timeness/Genis');
    return;
  }
  state.owner = parsed.owner;
  state.repo = parsed.repo;
  state.currentPath = '';
  state.cache.clear();
  state.activeFile = null;
  els.repoMeta.textContent = `${parsed.owner} / ${parsed.repo}`;
  window.navigateTo('');
});

// Optional: Enter key support
els.repoUrl.addEventListener('keydown', e => { if (e.key==='Enter') els.loadBtn.click(); });
</script>
